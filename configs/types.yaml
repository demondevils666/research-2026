# Названия итоговых типов (интерпретация, а не результат алгоритма).
# label — номер кластера в outputs/stage2/labels_static.csv (колонка type, KEFRiN на физической сети, K = 6, α = 0,6).
# anchor — МО, который обязан быть в этом типе: защита от того, что после перезапуска номера кластеров поменяются местами.
# Порядок code — по убыванию трат на жителя. Цвета — категориальная палитра в фиксированном порядке слотов,
# проверена валидатором (различимость соседних цветов, в т. ч. при нарушениях цветового зрения).
types:
  - {label: 2, code: T1, name: "Крупные города", short: "Крупные города", anchor: 1597, color: "#2a78d6",
     note: "Москва и Петербург (районы), миллионники и их спутники: самые высокие траты, много общепита и транспорта, мало продуктов (закон Энгеля)"}
  - {label: 0, code: T2, name: "Север и Дальний Восток", short: "Север и ДВ", anchor: 309, color: "#eb6834",
     note: "Высокие траты и зарплаты при плохой доступности рынков; маркетплейсов меньше всего (логистика)"}
  - {label: 5, code: T3, name: "Средние города и пригороды", short: "Средние города", anchor: 1007, color: "#1baf7a",
     note: "Средние и промышленные города, часть областных центров и пригороды крупных городов (половина МО — районы и округа): средний уровень трат, заметный общепит"}
  - {label: 4, code: T4, name: "Малые города и рабочие районы", short: "Малые города", anchor: 1672, color: "#eda100",
     note: "Небольшие индустриальные города и районы при них: траты ниже средних, транспорт ниже всех"}
  - {label: 1, code: T5, name: "Село с офлайн-корзиной", short: "Офлайн-село", anchor: 814, color: "#e87ba4",
     note: "Сельские районы без городов: общепита мало, на транспорт тратят больше среднего; от T6 отличаются меньшей долей маркетплейсов и большей — «прочего»"}
  - {label: 3, code: T6, name: "Аграрные районы, ушедшие в онлайн", short: "Онлайн-село", anchor: 1941, color: "#008300",
     note: "Аграрные районы с самыми низкими тратами: больше всех продуктов и маркетплейсов, почти нет общепита"}
# Сельские и малогородские типы — для проверки онлайна в аграрных районах (scripts/cash_check.py) и надежности (scripts/robustness.py)
rural: [T4, T5, T6]
